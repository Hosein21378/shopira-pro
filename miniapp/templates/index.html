<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopira Pro - فروشگاه</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap');
        body { font-family: 'Vazirmatn', system-ui, sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 text-white">
    <div class="max-w-md mx-auto min-h-screen bg-zinc-900">
        <!-- Header -->
        <div class="bg-zinc-800 p-4 flex items-center justify-between border-b border-zinc-700">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-emerald-600 rounded-2xl flex items-center justify-center">
                    <i class="fas fa-store text-2xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl">Shopira Pro</h1>
                    <p class="text-xs text-zinc-400">فروشگاه هوشمند</p>
                </div>
            </div>
            <div class="text-right">
                <div class="text-emerald-400 text-sm font-medium">موجودی</div>
                <div class="font-bold text-lg" id="balance">۰ تومان</div>
            </div>
        </div>

        <!-- Menu -->
        <div class="p-4">
            <div class="grid grid-cols-2 gap-3">
                <div onclick="showShop()" 
                     class="bg-zinc-800 hover:bg-zinc-700 transition-colors p-4 rounded-3xl flex flex-col items-center justify-center h-28 cursor-pointer">
                    <i class="fas fa-shopping-bag text-3xl text-emerald-400 mb-2"></i>
                    <span class="font-medium">فروشگاه</span>
                </div>
                
                <div onclick="showPayment()" 
                     class="bg-zinc-800 hover:bg-zinc-700 transition-colors p-4 rounded-3xl flex flex-col items-center justify-center h-28 cursor-pointer">
                    <i class="fas fa-credit-card text-3xl text-blue-400 mb-2"></i>
                    <span class="font-medium">پرداخت</span>
                </div>
                
                <div onclick="showSupport()" 
                     class="bg-zinc-800 hover:bg-zinc-700 transition-colors p-4 rounded-3xl flex flex-col items-center justify-center h-28 cursor-pointer">
                    <i class="fas fa-robot text-3xl text-purple-400 mb-2"></i>
                    <span class="font-medium">پشتیبانی AI</span>
                </div>
                
                <div onclick="showOrders()" 
                     class="bg-zinc-800 hover:bg-zinc-700 transition-colors p-4 rounded-3xl flex flex-col items-center justify-center h-28 cursor-pointer">
                    <i class="fas fa-history text-3xl text-orange-400 mb-2"></i>
                    <span class="font-medium">سفارشات</span>
                </div>
            </div>
        </div>

        <div class="p-4">
            <div class="bg-zinc-800 rounded-3xl p-4">
                <h3 class="font-bold mb-3 px-1">محصولات محبوب</h3>
                <div class="space-y-2">
                    <div class="flex items-center justify-between bg-zinc-900 p-3 rounded-2xl">
                        <div>
                            <div class="font-medium">اشتراک VPN ماهانه</div>
                            <div class="text-xs text-zinc-400">۱۵۰,۰۰۰ تومان</div>
                        </div>
                        <button onclick="buyProduct(1)" 
                                class="bg-emerald-600 hover:bg-emerald-700 px-4 py-1.5 text-sm rounded-2xl transition-colors">
                            خرید
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showShop() {
            window.Telegram.WebApp?.showAlert?.("در حال انتقال به بخش فروشگاه...");
            // TODO: navigate to shop page
        }
        
        function showPayment() {
            window.Telegram.WebApp?.showAlert?.("در حال باز شدن درگاه پاسارگاد...");
        }
        
        function showSupport() {
            window.Telegram.WebApp?.showAlert?.("پشتیبانی هوشمند فعال شد");
        }
        
        function showOrders() {
            alert("بخش سفارشات در حال توسعه...");
        }
        
        function buyProduct(productId) {
            if (confirm("آیا از خرید این محصول مطمئن هستید؟")) {
                // TODO: Call backend API
                alert("درخواست خرید ثبت شد!");
            }
        }
        
        // Initialize Telegram Mini App
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.expand();
            tg.ready();
            
            // Get user balance from bot (future)
            document.getElementById('balance').innerText = "۱۲۵,۰۰۰ تومان";
        }
    </script>
</body>
</html>
