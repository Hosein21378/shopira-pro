<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد - Shopira Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white">
    <div class="flex">
        <!-- Sidebar -->
        <div class="w-64 bg-zinc-900 min-h-screen p-4">
            <div class="flex items-center gap-3 mb-8 px-2">
                <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center">
                    <span class="text-xl">🛍️</span>
                </div>
                <div>
                    <h1 class="font-bold text-xl">Shopira Pro</h1>
                    <p class="text-xs text-zinc-400">پنل مدیریت</p>
                </div>
            </div>

            <nav class="space-y-1">
                <a href="/" class="flex items-center gap-3 px-4 py-3 rounded-2xl {{ 'bg-zinc-800' if active_tab == 'dashboard' else 'hover:bg-zinc-800' }}">
                    <span>📊</span> <span>داشبورد</span>
                </a>
                <a href="/users" class="flex items-center gap-3 px-4 py-3 rounded-2xl {{ 'bg-zinc-800' if active_tab == 'users' else 'hover:bg-zinc-800' }}">
                    <span>👥</span> <span>کاربران</span>
                </a>
                <a href="/products" class="flex items-center gap-3 px-4 py-3 rounded-2xl {{ 'bg-zinc-800' if active_tab == 'products' else 'hover:bg-zinc-800' }}">
                    <span>🛍️</span> <span>محصولات</span>
                </a>
                <a href="/financial" class="flex items-center gap-3 px-4 py-3 rounded-2xl {{ 'bg-zinc-800' if active_tab == 'financial' else 'hover:bg-zinc-800' }}">
                    <span>💳</span> <span>بخش مالی</span>
                </a>
                <a href="/backups" class="flex items-center gap-3 px-4 py-3 rounded-2xl {{ 'bg-zinc-800' if active_tab == 'backups' else 'hover:bg-zinc-800' }}">
                    <span>💾</span> <span>بکاپ</span>
                </a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 p-8">
            <h1 class="text-3xl font-bold mb-8">داشبورد</h1>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-zinc-900 rounded-3xl p-6">
                    <div class="text-zinc-400 text-sm">تعداد کاربران</div>
                    <div class="text-4xl font-bold mt-2">{{ total_users }}</div>
                </div>
                <div class="bg-zinc-900 rounded-3xl p-6">
                    <div class="text-zinc-400 text-sm">تعداد محصولات</div>
                    <div class="text-4xl font-bold mt-2">{{ total_products }}</div>
                </div>
                <div class="bg-zinc-900 rounded-3xl p-6">
                    <div class="text-zinc-400 text-sm">درآمد کل</div>
                    <div class="text-4xl font-bold mt-2 text-emerald-400">۰ تومان</div>
                </div>
            </div>
        </div>
    </div>
