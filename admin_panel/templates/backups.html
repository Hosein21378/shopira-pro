<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>بکاپ - Shopira Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white">
<div class="flex">
    <div class="w-64 bg-zinc-900 min-h-screen p-4">
        <div class="px-4 py-6">
            <h2 class="text-xl font-bold mb-6">Shopira Pro</h2>
            <nav class="space-y-2">
                <a href="/" class="block px-4 py-2 rounded-xl hover:bg-zinc-800">داشبورد</a>
                <a href="/users" class="block px-4 py-2 rounded-xl hover:bg-zinc-800">کاربران</a>
                <a href="/products" class="block px-4 py-2 rounded-xl hover:bg-zinc-800">محصولات</a>
                <a href="/financial" class="block px-4 py-2 rounded-xl hover:bg-zinc-800">بخش مالی</a>
                <a href="/backups" class="block px-4 py-2 bg-zinc-800 rounded-xl">بکاپ</a>
            </nav>
        </div>
    </div>

    <div class="flex-1 p-8">
        <h1 class="text-3xl font-bold mb-8">مدیریت بکاپ</h1>

        <div class="bg-zinc-900 rounded-3xl p-8 max-w-2xl">
            <form method="post" action="/backups/create">
                <button type="submit" 
                        class="bg-emerald-600 hover:bg-emerald-700 px-8 py-4 rounded-2xl text-lg font-medium w-full">
                    📦 ایجاد بکاپ جدید
                </button>
            </form>

            <div class="mt-8">
                <h3 class="font-bold mb-4">بکاپ‌های قبلی</h3>
                <div class="text-zinc-400 text-sm">
                    (در حال حاضر بکاپ‌ها در پوشه <code>backups/</code> ذخیره می‌شوند)
                </div>
            </div>
        </div>
    </div>
</div>
