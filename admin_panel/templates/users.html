<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>کاربران - Shopira Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white">
<div class="flex">
    <div class="w-64 bg-zinc-900 min-h-screen p-4">
        <div class="px-4 py-6">
            <h2 class="text-xl font-bold mb-6">Shopira Pro</h2>
            <nav class="space-y-2">
                <a href="/" class="block px-4 py-2 rounded-xl hover:bg-zinc-800">داشبورد</a>
                <a href="/users" class="block px-4 py-2 bg-zinc-800 rounded-xl">کاربران</a>
                <a href="/products" class="block px-4 py-2 rounded-xl hover:bg-zinc-800">محصولات</a>
                <a href="/financial" class="block px-4 py-2 rounded-xl hover:bg-zinc-800">بخش مالی</a>
                <a href="/backups" class="block px-4 py-2 rounded-xl hover:bg-zinc-800">بکاپ</a>
            </nav>
        </div>
    </div>

    <div class="flex-1 p-8">
        <h1 class="text-3xl font-bold mb-8">لیست کاربران</h1>

        <div class="bg-zinc-900 rounded-3xl overflow-hidden">
            <table class="w-full">
                <thead class="bg-zinc-800">
                    <tr>
                        <th class="text-right px-6 py-4">شناسه تلگرام</th>
                        <th class="text-right px-6 py-4">نام</th>
                        <th class="text-right px-6 py-4">موجودی</th>
                        <th class="text-right px-6 py-4">تاریخ ثبت</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                    <tr class="border-t border-zinc-800">
                        <td class="px-6 py-4">{{ user.telegram_id }}</td>
                        <td class="px-6 py-4">{{ user.first_name or '-' }}</td>
                        <td class="px-6 py-4">{{ user.balance or 0 }} تومان</td>
                        <td class="px-6 py-4 text-sm text-zinc-400">{{ user.created_at }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
