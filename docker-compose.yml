version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shopira
      POSTGRES_PASSWORD: shopira123
      POSTGRES_DB: shopira
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  bot:
    build: .
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql+asyncpg://shopira:shopira123@db/shopira
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    command: python -m bot.main

volumes:
  postgres_data:
